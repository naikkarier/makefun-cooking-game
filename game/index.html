<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dapur Kilat — Warung Rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2118; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; width: min(100vw, 150vh); height: min(100vh, 66.6667vw); touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="960" height="640" aria-label="Dapur Kilat: run the warung kitchen, cook orders and serve them before customers leave"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
